# For every app the desktop starts (app-*.service, app-*.scope): when it fails,
# myos-app-closed@ checks whether memory running out was the reason. One instance per
# app, so that systemd can tell it which app it was (with one shared unit, an app that
# had failed earlier made it "multiple trigger source candidates", and no notice came).
[Unit]
OnFailure=myos-app-closed@%p-%i.service
