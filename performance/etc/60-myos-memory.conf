# Memory settings that go with compressed memory (zswap or zram).
# Start making room earlier and in the background, so that an app that asks for a
# lot of memory at once does not have to wait for it.
vm.watermark_scale_factor = 125
vm.watermark_boost_factor = 0
# vm.swappiness and vm.page-cluster depend on where the compressed memory lives:
# /usr/libexec/myos/memory-setup sets them at every start.
