# Debian's installer partition settings, with these changes: Btrfs is the
# default filesystem, so system snapshots work and any change (including the
# AI's) can be undone; swap is a small partition by default; and "swap file"
# is not offered, because swap files on Btrfs need special handling.
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
initialSwapChoice: small

luksGeneration: luks2
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
essentialMounts: ["live-*", "control", "ventoy"]

lvm:
    enable: false

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4"]
