# Packages removed from the installed system once installation is done.
# Same as Debian's list, plus the installer itself.
backend: apt
operations:
  - try_remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - live-task-localisation
      - live-task-recommended
      - calamares-settings-debian
      - calamares
