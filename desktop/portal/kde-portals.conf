# Which program answers apps' requests to the desktop (file dialogs, settings, ...):
# KDE's own, for everything. Debian also installs the GTK one, which Plasma would ask for
# GTK settings and, as a last resort, for "Lockdown". On Debian 13 it leaked a handle for
# every program that asked it something; after about 1,000 it kept one processor core
# busy until the next login (seen on the test PC: 7.9 hours of CPU time). KDE's portal
# does all of this by itself, and "Lockdown" is not used.
[preferred]
default=kde
org.freedesktop.impl.portal.Settings=kde
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Lockdown=none
