<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Web pages and programs that ask for Windows' "Segoe UI" get Selawik: a free font
       with the same letter widths, so text fits where it was designed to fit. -->
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Selawik</family></accept>
  </alias>
</fontconfig>
